name: Prepare transparent garment images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install image processing
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rembg[cpu]>=2.0.60,<3' 'Pillow>=10,<13'
      - name: Generate static PNGs outside client browsers
        run: python scripts/generate-home-cutouts.py
      - name: Commit prepared images
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/home-cutouts
          if ! git diff --cached --quiet; then
            git commit -m "assets(home): regenerate static transparent garments"
            git push origin "HEAD:${REF_NAME}"
          fi
