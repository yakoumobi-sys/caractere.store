name: Prepare transparent garment assets

on:
  push:
    branches:
      - fix/static-transparent-garments
    paths:
      - .github/workflows/prepare-transparent-garments.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout proposed design branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install offline image processing tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rembg[cpu]>=2.0.60,<3' 'Pillow>=10,<13'

      - name: Cut out the garments once (never in Safari)
        run: python scripts/generate-home-cutouts.py

      - name: Commit verified transparent assets to design branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/home-cutouts/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(home): six pre-rendered transparent garments"
            git push origin HEAD:fix/static-transparent-garments
          fi
