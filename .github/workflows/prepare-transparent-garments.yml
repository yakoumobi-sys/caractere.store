name: Inspect carousel product imagery

on:
  push:
    branches:
      - fix/oversized-polo-carousel
    paths:
      - .github/workflows/prepare-transparent-garments.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate compact comparison
        run: python scripts/check-home-garments.py
      - name: Save reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/home-cutouts/_diagnostic.jpg
          git commit -m "test: reference oversized crop and polo photo"
          git push origin HEAD:fix/oversized-polo-carousel
