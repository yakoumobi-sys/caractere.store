name: Generate polo and repair oversized garment

on:
  push:
    branches:
      - fix/oversized-polo-carousel
    paths:
      - .github/workflows/prepare-transparent-garments.yml
      - scripts/generate-home-cutouts.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cutouts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout design branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rembg[cpu]>=2.0.60,<3' 'Pillow>=10,<13'
      - name: Create two transparent products
        run: python scripts/generate-home-cutouts.py --only tshirt-oversized polo
      - name: Commit assets and remove temporary diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch public/home-cutouts/_diagnostic.jpg
          git add -A public/home-cutouts
          if ! git diff --cached --quiet; then
            git commit -m "assets(home): repaired oversized sleeve and transparent polo"
            git fetch origin fix/oversized-polo-carousel
            git rebase origin/fix/oversized-polo-carousel
            git push origin HEAD:fix/oversized-polo-carousel
          fi
