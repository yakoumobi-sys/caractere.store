<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="poloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcdcdc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#fafafa"/>
  <!-- Polo shirt back -->
  <path d="M 200 150 Q 400 115 600 150 L 650 300 L 650 700 L 150 700 L 150 300 Z" fill="url(#poloGrad)" stroke="#333" stroke-width="2"/>
  <!-- Collar back part -->
  <path d="M 370 170 Q 400 152 430 170" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Design area on back -->
  <rect x="280" y="310" width="240" height="260" fill="none" stroke="#FF6B9D" stroke-width="3" stroke-dasharray="8,4" rx="4"/>
  <text x="400" y="330" font-size="14" fill="#999" text-anchor="middle">Zone de design</text>
  <!-- Seams -->
  <path d="M 200 150 L 150 300" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 600 150 L 650 300" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Label -->
  <text x="400" y="760" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Polo VERSO</text>
</svg>
