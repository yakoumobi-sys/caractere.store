<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e5e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#fafafa"/>
  <!-- Apron back -->
  <path d="M 250 120 L 350 120 L 400 100 L 450 120 L 550 120 L 600 200 L 600 720 L 200 720 L 200 200 Z" fill="url(#apronGrad)" stroke="#333" stroke-width="2"/>
  <!-- Neck strap back -->
  <rect x="380" y="80" width="40" height="40" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <!-- Shoulder straps -->
  <path d="M 350 120 L 350 160" stroke="#333" stroke-width="2"/>
  <path d="M 450 120 L 450 160" stroke="#333" stroke-width="2"/>
  <!-- Pocket area -->
  <rect x="280" y="280" width="240" height="300" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="5,5" rx="4"/>
  <text x="400" y="300" font-size="14" fill="#999" text-anchor="middle">Poche</text>
  <!-- Design area -->
  <rect x="300" y="330" width="200" height="200" fill="none" stroke="#FF6B9D" stroke-width="3" stroke-dasharray="8,4" rx="4"/>
  <text x="400" y="350" font-size="14" fill="#FF6B9D" text-anchor="middle">Zone de design</text>
  <!-- Center line -->
  <path d="M 400 120 L 400 720" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Label -->
  <text x="400" y="760" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Tablier VERSO</text>
</svg>
