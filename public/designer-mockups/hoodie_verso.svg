<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcdcdc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#fafafa"/>
  <!-- Hoodie body back -->
  <path d="M 180 200 L 300 200 L 360 150 L 400 130 L 440 150 L 500 200 L 620 200 L 670 350 L 670 720 L 130 720 L 130 350 Z" fill="url(#hoodieGrad)" stroke="#333" stroke-width="2"/>
  <!-- Drawstrings area -->
  <path d="M 320 200 Q 400 190 480 200" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Center zipper/seam -->
  <line x1="400" y1="200" x2="400" y2="720" stroke="#ccc" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Kangaroo pocket area line -->
  <line x1="280" y1="350" x2="520" y2="350" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Design area on back -->
  <rect x="270" y="280" width="260" height="320" fill="none" stroke="#FF6B9D" stroke-width="3" stroke-dasharray="8,4" rx="4"/>
  <text x="400" y="300" font-size="14" fill="#999" text-anchor="middle">Zone de design</text>
  <!-- Label -->
  <text x="400" y="760" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Hoodie VERSO</text>
</svg>
