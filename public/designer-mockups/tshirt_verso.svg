<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shirtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#fafafa"/>
  <!-- T-shirt back -->
  <path d="M 200 150 L 250 150 L 280 120 L 320 100 L 400 90 L 480 100 L 520 120 L 550 150 L 600 150 L 650 280 L 650 700 L 150 700 L 150 280 Z" fill="url(#shirtGradient)" stroke="#333" stroke-width="2"/>
  <!-- Neck area -->
  <ellipse cx="400" cy="150" rx="80" ry="50" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <!-- Design area on back -->
  <rect x="280" y="300" width="240" height="280" fill="none" stroke="#FF6B9D" stroke-width="3" stroke-dasharray="8,4" rx="4"/>
  <text x="400" y="320" font-size="14" fill="#999" text-anchor="middle">Zone de design</text>
  <!-- Seams -->
  <path d="M 200 150 L 200 700" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 600 150 L 600 700" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Label -->
  <text x="400" y="760" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">T-shirt VERSO</text>
</svg>
