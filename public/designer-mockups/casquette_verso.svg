<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#fafafa"/>
  <!-- Cap back view -->
  <ellipse cx="400" cy="250" rx="150" ry="120" fill="url(#capGrad)" stroke="#333" stroke-width="2"/>
  <!-- Back strap -->
  <rect x="320" y="360" width="160" height="80" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="8"/>
  <!-- Strap details -->
  <line x1="340" y1="360" x2="340" y2="440" stroke="#ddd" stroke-width="1"/>
  <line x1="360" y1="360" x2="360" y2="440" stroke="#ddd" stroke-width="1"/>
  <line x1="440" y1="360" x2="440" y2="440" stroke="#ddd" stroke-width="1"/>
  <line x1="460" y1="360" x2="460" y2="440" stroke="#ddd" stroke-width="1"/>
  <!-- Design area -->
  <rect x="280" y="180" width="240" height="140" fill="none" stroke="#FF6B9D" stroke-width="3" stroke-dasharray="8,4" rx="4"/>
  <text x="400" y="200" font-size="12" fill="#999" text-anchor="middle">Zone de design</text>
  <!-- Label -->
  <text x="400" y="760" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Casquette VERSO</text>
</svg>
