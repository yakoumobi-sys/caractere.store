  <path d="M 500 120 Q 500 80 460 70" fill="none" stroke="#8B7355" stroke-width="8"/>
  <!-- Bag fold lines -->
  <path d="M 250 220 L 250 700" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 550 220 L 550 700" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
