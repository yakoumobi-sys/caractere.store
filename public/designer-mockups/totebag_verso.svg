      <stop offset="0%" style="stop-color:#f5f0e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8dfd2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#fafafa"/>
