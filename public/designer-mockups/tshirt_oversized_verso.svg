<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shirtGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#fafafa"/>
  <!-- Oversized T-shirt back -->
  <path d="M 150 150 Q 400 100 650 150 L 700 300 L 700 700 L 100 700 L 100 300 Z" fill="url(#shirtGrad2)" stroke="#333" stroke-width="2"/>
  <!-- Collar seam (back neckline stitching) -->
  <path d="M 330 170 Q 400 150 470 170" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Design area on back -->
  <rect x="260" y="290" width="280" height="320" fill="none" stroke="#FF6B9D" stroke-width="3" stroke-dasharray="8,4" rx="4"/>
  <text x="400" y="310" font-size="14" fill="#999" text-anchor="middle">Zone de design</text>
  <!-- Seams -->
  <path d="M 150 150 L 100 300" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 650 150 L 700 300" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Label -->
  <text x="400" y="760" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">T-shirt Oversized VERSO</text>
</svg>
